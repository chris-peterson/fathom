name: fathom
version: 0.1.0
description: "Keeps the facts of a piece of work in one versioned record and renders each reader's document from it, with every figure traced to a fact."
author: chris-peterson
repository: https://github.com/chris-peterson/fathom
icon: .claude-plugin/icon.svg
license: MIT
keywords: [claude, documents, incidents, postmortem, record, views, citations]

validate:
  accept:
    - warning: root
      path: CLAUDE.md
      because: >-
        CLAUDE.md at the root is this repo's own agent instructions, not context
        the plugin ships. It points at AGENTS.md, which every agent reads.

marketplace:
  category: documentation
  homepage: https://chris-peterson.github.io/fathom/#/

suite:
  group: charts
  activations: [user]
  gloss: "fathom: one record of facts, rendered for each reader."
  pitch: "Stop writing the same facts into three documents that drift apart. Record them once, render every reader's view from the record."
  what: "Keeps the facts of a piece of work (an incident, an investigation) in one versioned record, then renders each reader's document from it: an analysis for engineers, a status for managers, an explainer for everyone else. Every figure in a view cites the fact it came from, and a check fails any number the record doesn't hold."
  cmds:
    - ["/fathom:record", "Turn evidence into facts in the record"]
    - ["/fathom:render", "Write a view of the record for one reader"]
    - ["/fathom:pdf", "Print a view for readers outside Claude"]
  # >>> shipyard:describe — generated from source by `shipyard gen-describe`; do not edit >>>
  describe:
    skills:
      pdf: This skill should be used when the user wants a PDF to share with people who can't open the original, such as "/fathom:pdf", "make a PDF of this view", "export this artifact to PDF", "turn this into a one-pager", "I need to send this to someone without Claude", or "print this page".
      record: This skill should be used when the user is gathering the facts of a piece of work (an incident, an investigation, a migration, a test campaign) and wants them kept in one place every document can be rendered from, such as "/fathom:record", "start a record for this incident", "add this to the record", "here's the audit log export", "what does this change in the timeline", "keep track of what we know", or when the user pastes a blob of evidence (a log export, a chat transcript, an API dump) into a session that already has a fathom record.
      render: This skill should be used when the user wants a document made from a fathom record, for one reader, such as "/fathom:render", "write this up for managers", "render the analysis", "make the RCA page", "an explainer for the product team", "a postmortem draft", "render all the views", or "re-render as of the latest version".
  # <<< shipyard:describe <<<

docs:
  code_languages: [bash, yaml, json]
  mermaid: false
