name: fathom
version: 0.2.0
description: "Keeps the facts of a piece of work in one versioned record and renders each reader's document from it, with every figure traced to a fact."
author: chris-peterson
repository: https://github.com/chris-peterson/fathom
icon: .claude-plugin/icon.svg
license: MIT
keywords: [claude, documents, incidents, postmortem, record, views, citations]
# /fathom:pdf designs each one-pager with the frontend-design skill.
dependencies:
  - name: frontend-design
    marketplace: claude-plugins-official

validate:
  accept:
    - warning: root
      path: CLAUDE.md
      because: >-
        CLAUDE.md at the root is this repo's own agent instructions, not context
        the plugin ships. It points at AGENTS.md, which every agent reads.

marketplace:
  category: documentation
  homepage: https://chris-peterson.github.io/fathom/#/

suite:
  group: charts
  activations: [user]
  gloss: "fathom: one record of facts, rendered for each reader."
  pitch: "Stop writing the same facts into three documents that drift apart. Record them once, render every reader's view from the record."
  what: "Keeps the facts of a piece of work (an incident, an investigation) in one named, versioned record with a current bottom line, its lede, then renders each reader's document from it: a one-page status for managers, an analysis for engineers, an explainer for everyone else. Every view opens with the lede in its reader's terms, every figure cites the fact it came from, and a check fails any number the record doesn't hold."
  cmds:
    - ["/fathom:record", "Turn evidence into facts in the record"]
    - ["/fathom:render", "Write a view of the record for one reader"]
    - ["/fathom:pdf", "Print a view for readers outside Claude"]
    - ["/fathom:compact", "Prune what a record no longer needs, with your say-so"]
    - ["/fathom:proof", "Rule a claim true or false, with the evidence"]
    - ["/fathom:wtf", "Rewrite the last reply so you can read it"]
    - ["/fathom:slack", "Share the last reply or the transcript in Slack"]
  # >>> shipyard:describe — generated from source by `shipyard gen-describe`; do not edit >>>
  describe:
    skills:
      compact: This skill should be used when a fathom record has grown past what its readers need and should be pruned, such as "/fathom:compact", "compact the record", "clean up the record", "prune facts that no longer matter", "these facts are stale, remove them", or when a fathom hook reports that the conversation was compacted and names records to compact.
      pdf: This skill should be used when the user wants a PDF to share with people who can't open the original, such as "/fathom:pdf", "make a PDF of this view", "export this artifact to PDF", "turn this into a one-pager", "I need to send this to someone without Claude", or "print this page".
      proof: Rule a claim true or false, with sources and how each is known.
      record: This skill should be used when the user is gathering the facts of a piece of work (an incident, an investigation, a migration, a test campaign) and wants them kept in one place every document can be rendered from, such as "/fathom:record", "start a record for this incident", "add this to the record", "here's the audit log export", "what does this change in the timeline", "keep track of what we know", or when the user pastes a blob of evidence (a log export, a chat transcript, an API dump) into a session that already has a fathom record.
      render: This skill should be used when the user wants a document made from a fathom record, for one reader, such as "/fathom:render", "write this up for managers", "render the analysis", "make the RCA page", "an explainer for the product team", "a postmortem draft", "render all the views", or "re-render as of the latest version".
      slack: This skill should be used when the user wants something from the session shared in Slack, such as "/fathom:slack", "copy to Slack", "post this in Slack", "write this up for the channel", "copy the transcript for Slack", "summarize this for the team", or "explain this in Slack for a non-technical audience".
      wtf: Redo what you just said so the user can read it, and quietly stop doing whatever made it unreadable.
    hooks:
      after-compact: SessionStart — After a conversation compaction, starts /fathom:compact on the records this session wrote.
      hooks: 'Hook wiring: PreCompact→pre-compact; SessionStart→after-compact (compact); PostToolUse→tack (Bash|Skill); UserPromptSubmit→tack.'
      pre-compact: PreCompact — Before a conversation compaction, asks the summary to carry the reasoning behind each record this session wrote.
      tack: 'PostToolUse / UserPromptSubmit — Keeps a session record for a tack: creates it when a route binds, carries /goal into it, and renders its recap when /tack:end runs.'
  # <<< shipyard:describe <<<

docs:
  code_languages: [bash, yaml, json]
  mermaid: true
